<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | MD SR Shanto</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header class="header">
        <div class="logo-container">
            <img src="image/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'"> 
            <a href="index.html" class="logo">MD SR <span>Shanto</span></a>
        </div>
        <nav class="navbar">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="education.html" class="nav-link">Education</a>
            <a href="projects.html" class="nav-link">Projects</a>
            <a href="contact.html" class="nav-link active">Contact</a>
        </nav>
        <div id="menu-btn" class="fas fa-bars"></div>
    </header>

    <main>
        <section class="page-content contact" id="contact">
            <h2 class="heading reveal">Contact <span>Me</span></h2>
            
            <div class="glass-card contact-card reveal">
                <form action="#" onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent successfully.');">
                    <div class="input-box">
                        <input type="text" placeholder="Full Name" required>
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="input-box">
                        <input type="text" placeholder="Mobile Number">
                        <input type="text" placeholder="Email Subject">
                    </div>
                    <textarea cols="30" rows="8" placeholder="Your Message" required></textarea>
                    <input type="submit" value="Send Message" class="btn primary-btn">
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Copyright &copy; 2026 by MD SR Shanto | All Rights Reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
